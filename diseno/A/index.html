:root {
  color-scheme: dark;
  --fondo: #0B0B0C;
  --sup: #151517;
  --sup2: #1E1E21;
  --linea: #2C2C31;
  --texto: #F4F4F5;
  --texto2: #ABABB3;
  --texto3: #8E8E97;
  --acento: #97A3FF;
  --acento-suave: rgba(151, 163, 255, .14);
  --sobre-acento: #0B0B0C;
  --bien: #52D98E;
  --casi: #F2BA55;
  --mal: #FF7D74;
  --radio: 22px;
  --radio-s: 14px;
  --sombra: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 32px rgba(0,0,0,.35);
  --suave: cubic-bezier(.2, .7, .2, 1);
  --fuente: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fuente-ipa: "Noto IPA", "Noto Sans", Roboto, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--fondo); color: var(--texto);
  font: 400 16px/1.5 var(--fuente); letter-spacing: -.005em;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 3px; border-radius: 10px; }
[hidden] { display: none !important; }
.ipa { font-family: var(--fuente-ipa); font-weight: 500; letter-spacing: 0; }
.oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 440px; margin: 0 auto; min-height: 100dvh; padding: 0 20px calc(110px + env(safe-area-inset-bottom)); }
.vista { animation: entrar .35s var(--suave); }
@keyframes entrar { from { opacity: 0; transform: translateY(8px); } }

/* Barra superior */
.barra { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 8px; }
.marca { font-weight: 600; font-size: 15px; color: var(--texto2); display: flex; align-items: center; gap: 8px; }
.marca i { width: 8px; height: 8px; border-radius: 50%; background: var(--acento); }
.idioma { display: flex; background: var(--sup); border: 1px solid var(--linea); border-radius: 999px; padding: 3px; }
.idioma button { padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--texto2); min-height: 36px; transition: background .2s, color .2s; }
.idioma button[aria-pressed="true"] { background: var(--sup2); color: var(--texto); box-shadow: 0 1px 2px rgba(0,0,0,.4); }

h1 { font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -.03em; margin: 18px 0 6px; }
.sub { color: var(--texto2); font-size: 15px; }
h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--texto3); margin: 34px 0 12px; display: flex; justify-content: space-between; }
h2 span { text-transform: none; letter-spacing: 0; font-weight: 500; }

/* Aviso de descarga del modelo */
.aviso { margin-top: 18px; width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: var(--sup); border: 1px solid var(--linea); border-radius: var(--radio-s); padding: 12px 14px; font-size: 14px; color: var(--texto2); }
.aviso b { color: var(--texto); font-weight: 500; display: block; }
.aviso .mini { flex: 0 0 34px; }
.anillo { transform: rotate(-90deg); }
.anillo circle { fill: none; stroke-width: 3.5; }
.anillo .pista { stroke: var(--linea); }
.anillo .valor { stroke: var(--acento); stroke-linecap: round; transition: stroke-dashoffset .4s var(--suave); }

/* Tarjetas */
.tarjeta { background: var(--sup); border: 1px solid var(--linea); border-radius: var(--radio); padding: 22px; box-shadow: var(--sombra); }
.heroe { position: relative; overflow: hidden; margin-top: 22px; padding: 24px 22px 22px; }
.heroe::before { content: ""; position: absolute; inset: -40% -30% auto auto; width: 260px; height: 260px; background: radial-gradient(circle, rgba(151,163,255,.22), transparent 65%); pointer-events: none; }
.etiqueta { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--acento); }
.heroe .glifo { font-size: 112px; line-height: 1; margin: 14px 0 10px; letter-spacing: -.02em; }
.heroe h3 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
.heroe p { color: var(--texto2); margin-top: 6px; font-size: 15px; }
.palabritas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.palabritas span { font-size: 13px; color: var(--texto2); background: var(--sup2); border-radius: 999px; padding: 4px 10px; }

.boton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 999px; font-weight: 600; font-size: 16px; transition: transform .15s var(--suave), background .2s; }
.boton:active { transform: scale(.97); }
.boton.primario { background: var(--acento); color: var(--sobre-acento); }
.boton.secundario { background: var(--sup2); color: var(--texto); border: 1px solid var(--linea); }
.heroe .boton { margin-top: 20px; width: 100%; }

/* Rejilla de sonidos */
.rejilla { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.losa { position: relative; background: var(--sup); border: 1px solid var(--linea); border-radius: 18px; padding: 14px 12px 12px; text-align: left; min-height: 104px; display: flex; flex-direction: column; transition: transform .15s var(--suave), border-color .2s, background .2s; }
.losa:hover { border-color: #3a3a40; background: #18181b; }
.losa:active { transform: scale(.97); }
.losa .ipa { font-size: 34px; line-height: 1.1; }
.losa small { color: var(--texto2); font-size: 13px; margin-top: auto; }
.losa .barrita { height: 3px; border-radius: 3px; background: var(--linea); margin-top: 8px; overflow: hidden; }
.losa .barrita i { display: block; height: 100%; background: var(--acento); border-radius: 3px; }
.losa .punto { position: absolute; top: 12px; right: 12px; width: 7px; height: 7px; border-radius: 50%; background: var(--casi); }

/* Lista de referencia (Sonidos) */
.filtro { display: flex; gap: 8px; margin-top: 18px; }
.filtro button { padding: 8px 14px; min-height: 40px; border-radius: 999px; border: 1px solid var(--linea); color: var(--texto2); font-size: 14px; font-weight: 500; }
.filtro button[aria-pressed="true"] { background: var(--texto); color: var(--fondo); border-color: var(--texto); }
.fila { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 0; border-bottom: 1px solid var(--linea); }
.fila .ipa { font-size: 28px; width: 52px; flex: none; text-align: center; }
.fila div { flex: 1; min-width: 0; }
.fila b { font-weight: 500; display: block; }
.fila p { color: var(--texto2); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fila svg { flex: none; color: var(--texto3); }

/* Progreso */
.cifras { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
.cifra { padding: 18px; }
.cifra .num { font-size: 40px; font-weight: 700; letter-spacing: -.04em; line-height: 1.05; }
.cifra .num small { font-size: 18px; color: var(--texto2); font-weight: 500; margin-left: 2px; }
.cifra p { color: var(--texto2); font-size: 14px; }
.semana { display: flex; justify-content: space-between; margin-top: 16px; }
.dia { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--texto3); }
.dia i { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--linea); display: grid; place-items: center; }
.dia.hecho i { background: var(--acento-suave); border-color: transparent; }
.dia.hecho i::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--acento); }
.dia.hoy { color: var(--texto); font-weight: 600; }
.dia.hoy i { border-color: var(--acento); }
.linea-grafica { width: 100%; height: 72px; margin-top: 14px; display: block; }
.trabajar .fila .ipa { color: var(--texto); }
.medidor { height: 4px; border-radius: 4px; background: var(--linea); margin-top: 8px; overflow: hidden; }
.medidor i { display: block; height: 100%; background: var(--casi); border-radius: 4px; }
.dominados { display: flex; flex-wrap: wrap; gap: 8px; }
.dominados span { font-size: 18px; padding: 6px 12px; border-radius: 12px; background: rgba(82,217,142,.1); color: var(--bien); }

/* Barra de pestañas */
.pestanas { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100%, 440px); display: grid; grid-template-columns: repeat(3, 1fr); padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); background: rgba(11,11,12,.82); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border-top: 1px solid var(--linea); z-index: 10; }
.pestanas button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; min-height: 56px; font-size: 12px; font-weight: 500; color: var(--texto3); border-radius: 14px; transition: color .2s; }
.pestanas button[aria-current="page"] { color: var(--texto); }
.pestanas button[aria-current="page"] svg { color: var(--acento); }

/* Lección */
.cabecera { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 14px 0; margin: 0 -20px; padding-inline: 20px; background: linear-gradient(var(--fondo) 70%, transparent); }
.redondo { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--sup); border: 1px solid var(--linea); flex: none; transition: transform .15s var(--suave); }
.redondo:active { transform: scale(.94); }
.cabecera .titulo { font-weight: 600; font-size: 16px; }
.cabecera .titulo small { display: block; color: var(--texto3); font-weight: 400; font-size: 13px; }
.leccion-glifo { font-size: 96px; line-height: 1; margin: 6px 0 4px; }
.paso { margin-top: 30px; }
#vista-leccion { padding-bottom: 80px; } /* el dock (hasta 181 px grabando) no tapa el par mínimo */
.paso h2 { margin-top: 0; }
.como { font-size: 18px; line-height: 1.55; }
.ojo { margin-top: 14px; display: flex; gap: 10px; padding: 14px 16px; border-radius: var(--radio-s); background: rgba(242,186,85,.08); color: #F6D9A2; font-size: 15px; }
.ojo b { color: var(--casi); font-weight: 600; }
.ojo svg { color: var(--casi); margin-top: 2px; }
.palabras { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: 0 -2px; }
.palabras button { flex: none; min-height: 44px; padding: 0 18px; border-radius: 999px; background: var(--sup); border: 1px solid var(--linea); color: var(--texto2); font-weight: 500; transition: all .2s; }
.palabras button[aria-pressed="true"] { background: var(--acento-suave); border-color: var(--acento); color: var(--texto); }
.practica { margin-top: 14px; text-align: center; padding: 28px 22px; }
.practica .palabra { font-size: 44px; font-weight: 700; letter-spacing: -.035em; line-height: 1.1; }
.practica .objetivo { font-size: 22px; color: var(--texto2); margin-top: 6px; }
.practica .objetivo mark { background: none; color: var(--acento); }
.practica .redondo { margin: 16px auto 0; width: auto; padding: 0 18px; border-radius: 999px; display: inline-flex; gap: 8px; min-height: 44px; font-weight: 500; font-size: 15px; }

/* Resultado */
.resultado { margin-top: 22px; padding-top: 22px; border-top: 1px solid var(--linea); text-align: left; }
.nota { display: flex; align-items: baseline; gap: 10px; }
.nota .num { font-size: 40px; font-weight: 700; letter-spacing: -.04em; }
.nota p { color: var(--texto2); font-size: 15px; }
.fichas { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.ficha { min-width: 64px; padding: 10px 12px 8px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 1px solid; animation: ficha .4s var(--suave) backwards; }
.ficha > .ipa { font-size: 28px; line-height: 1.15; }
.ficha small { font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 3px; white-space: nowrap; }
.ficha.bien { color: var(--bien); background: rgba(82,217,142,.09); border-color: rgba(82,217,142,.3); }
.ficha.casi { color: var(--casi); background: rgba(242,186,85,.09); border-color: rgba(242,186,85,.32); }
.ficha.mal { color: var(--mal); background: rgba(255,125,116,.09); border-color: rgba(255,125,116,.34); }
@keyframes ficha { from { opacity: 0; transform: translateY(6px) scale(.96); } }
.oido { margin-top: 14px; color: var(--texto2); font-size: 14px; }
.oido .ipa { color: var(--texto); }
.consejo { margin-top: 12px; font-size: 15px; color: var(--texto); }
.acciones { display: flex; gap: 8px; margin-top: 18px; }
.acciones .boton { flex: 1; padding: 0 14px; font-size: 15px; }
.leyenda { display: flex; gap: 14px; margin-top: 16px; font-size: 12px; color: var(--texto3); }
.leyenda i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.esqueleto { display: flex; gap: 8px; margin-top: 14px; }
.esqueleto i { width: 64px; height: 62px; border-radius: 16px; background: linear-gradient(90deg, var(--sup2), #26262a, var(--sup2)); background-size: 200% 100%; animation: brillo 1.1s linear infinite; }
@keyframes brillo { to { background-position: -200% 0; } }

.par { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.par button { background: var(--sup); border: 1px solid var(--linea); border-radius: 18px; padding: 18px 14px; text-align: left; transition: border-color .2s; }
.par button:hover { border-color: #3a3a40; }
.par b { font-size: 22px; font-weight: 600; letter-spacing: -.02em; display: block; }
.par .ipa { color: var(--texto2); font-size: 17px; }
.par small { display: flex; align-items: center; gap: 6px; color: var(--texto3); margin-top: 10px; font-size: 13px; }

/* Error de micrófono */
.error { margin-top: 22px; padding: 20px; text-align: left; border-radius: 18px; background: rgba(255,125,116,.06); border: 1px solid rgba(255,125,116,.28); }
.error .icono { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: rgba(255,125,116,.12); color: var(--mal); }
.error h3 { font-size: 19px; font-weight: 600; margin-top: 14px; letter-spacing: -.01em; }
.error p { color: var(--texto2); margin-top: 6px; font-size: 15px; }
.error ol { margin: 14px 0 0; padding-left: 20px; color: var(--texto); font-size: 15px; display: grid; gap: 6px; }
.error .boton { margin-top: 18px; width: 100%; }

/* Dock de grabación */
.dock { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100%, 440px); padding: 14px 20px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 10px; background: linear-gradient(transparent, var(--fondo) 38%); z-index: 10; }
.dock p { font-size: 14px; color: var(--texto2); min-height: 21px; font-variant-numeric: tabular-nums; }
.grabar { position: relative; width: 80px; height: 80px; border-radius: 50%; background: var(--acento); color: var(--sobre-acento); display: grid; place-items: center; box-shadow: 0 10px 30px rgba(151,163,255,.28); transition: transform .2s var(--suave), background .2s; }
.grabar:active { transform: scale(.94); }
.grabar::before { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid var(--acento); opacity: 0; }
.grabar[data-estado="grabando"]::before { animation: pulso 1.4s var(--suave) infinite; }
.grabar[data-estado="analizando"] { background: var(--sup2); color: var(--texto2); box-shadow: none; }
.grabar[disabled] { cursor: default; }
@keyframes pulso { from { opacity: .7; transform: scale(.92); } to { opacity: 0; transform: scale(1.25); } }
.ondas { display: flex; align-items: center; gap: 3px; height: 28px; }
.ondas i { width: 3px; height: 4px; border-radius: 2px; background: var(--acento); transition: height .09s linear; }

/* Hoja del modelo */
.velo { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20; display: flex; align-items: flex-end; justify-content: center; animation: aparecer .25s ease; }
@keyframes aparecer { from { opacity: 0; } }
.hoja { width: min(100%, 440px); background: var(--sup); border: 1px solid var(--linea); border-bottom: 0; border-radius: 28px 28px 0 0; padding: 12px 24px calc(24px + env(safe-area-inset-bottom)); animation: subir .35s var(--suave); }
@keyframes subir { from { transform: translateY(40px); opacity: 0; } }
.agarre { width: 40px; height: 5px; border-radius: 3px; background: var(--linea); margin: 0 auto 20px; }
.hoja h3 { font-size: 24px; font-weight: 700; letter-spacing: -.025em; line-height: 1.2; margin-top: 14px; }
.hoja > p { color: var(--texto2); margin-top: 10px; font-size: 15px; }
.puntos { list-style: none; padding: 0; margin-top: 18px; display: grid; gap: 12px; font-size: 15px; }
.puntos li { display: flex; gap: 12px; align-items: flex-start; }
.puntos svg { flex: none; color: var(--acento); margin-top: 2px; }
.barra-carga { height: 8px; border-radius: 8px; background: var(--sup2); margin-top: 22px; overflow: hidden; }
.barra-carga i { display: block; height: 100%; width: 0; background: var(--acento); border-radius: 8px; transition: width .4s var(--suave); }
.carga-texto { display: flex; justify-content: space-between; font-size: 13px; color: var(--texto2); margin-top: 8px; font-variant-numeric: tabular-nums; }
.hoja .boton { width: 100%; margin-top: 20px; }

/* Panel de estados (solo prototipo) */
.demo { position: relative; max-width: 440px; margin: 10px auto 0; padding: 0 20px; z-index: 30; font-size: 13px; display: flex; justify-content: flex-end; }
.demo summary { display: inline-block; list-style: none; cursor: pointer; padding: 6px 12px; border-radius: 999px; background: #25252a; color: var(--texto2); border: 1px dashed #4a4a52; }
.demo summary::-webkit-details-marker { display: none; }
.demo div { position: absolute; right: 20px; top: 38px; width: 230px; background: #1b1b1e; border: 1px solid var(--linea); border-radius: 14px; padding: 6px; box-shadow: var(--sombra); display: grid; }
.demo button { text-align: left; padding: 10px 12px; border-radius: 10px; color: var(--texto); }
.demo button:hover { background: var(--sup2); }

.toast { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); background: var(--texto); color: var(--fondo); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; z-index: 40; animation: aparecer .2s ease; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
@media (min-width: 900px) {
  .demo { position: fixed; top: 16px; right: 16px; margin: 0; padding: 0; }
  .demo div { right: 0; }
}
</style>
</head>

<script>
const DATOS = {"lecciones":{"en":[{"ipa":"ɪ","nombre":"i corta (ship)","como":"Lengua un poco más baja y relajada que en la i española. Boca casi neutra, sin sonreír. Es corta.","trampa":"Si la dices como i española, ship suena a sheep.","palabras":["ship","live","it","bit","fill","minute"],"par":["ship","sheep"]},{"ipa":"i","nombre":"i larga (sheep)","como":"Labios estirados como sonriendo, lengua alta y tensa. Alárgala un poco.","trampa":"Es parecida a la i española pero más larga y tensa.","palabras":["sheep","leave","eat","beat","feel","team"],"par":["leave","live"]},{"ipa":"æ","nombre":"a abierta (cat)","como":"Abre mucho la mandíbula y estira los labios hacia los lados, entre una a y una e.","trampa":"Los hispanohablantes la dicen como a normal: cat y cut suenan igual.","palabras":["cat","bad","man","happy","black","plan"],"par":["bad","bed"]},{"ipa":"ʌ","nombre":"a corta (cut)","como":"Boca medio abierta y relajada, lengua al centro. Como una a española corta y apagada.","trampa":"No la redondees como o: but no es bot.","palabras":["cut","but","love","money","up","trouble"],"par":["cut","cat"]},{"ipa":"ɑ","nombre":"a de garganta (hot)","como":"Abre bien la boca y baja la lengua hacia atrás, como cuando el médico te pide decir aaa.","trampa":"En inglés americano hot y lot se dicen con a, no con o.","palabras":["hot","stop","father","job","body","not"],"par":["cot","cut"]},{"ipa":"ə","nombre":"schwa (about)","como":"Todo relajado: boca entreabierta, lengua quieta en el centro. Es un sonido débil y corto, como un eh perezoso.","trampa":"Es la vocal más común del inglés. Las sílabas sin acento casi siempre se reducen a schwa, no se leen como se escriben.","palabras":["about","problem","data","banana","support","today"],"par":["support","sport"]},{"ipa":"ʊ","nombre":"u corta (full)","como":"Labios poco redondeados y lengua relajada. Más corta y floja que la u española.","trampa":"Si la dices como u española, full suena a fool.","palabras":["full","book","good","put","look","could"],"par":["full","fool"]},{"ipa":"ɜ","nombre":"vocal de bird (con r)","como":"Labios neutros, lengua al centro y la punta doblada hacia atrás sin tocar nada, todo en un solo sonido.","trampa":"No digas ber-d con e más r: es una sola vocal con color de r.","palabras":["bird","work","learn","first","word","research"],"par":["work","walk"]},{"ipa":"θ","nombre":"th sorda (think)","como":"Punta de la lengua entre los dientes y sopla aire sin voz. Es la z de España.","trampa":"No la cambies por t ni s: think no es tink ni sink.","palabras":["think","three","thought","method","both","growth"],"par":["think","sink"]},{"ipa":"ð","nombre":"th sonora (this)","como":"Igual que θ, lengua entre los dientes, pero haciendo vibrar las cuerdas vocales. Parecida a la d suave de 'nada'.","trampa":"No la digas como una d dura: this no es dis.","palabras":["this","the","other","whether","father","though"],"par":["they","day"]},{"ipa":"v","nombre":"v de dientes","como":"Dientes de arriba sobre el labio de abajo, con voz. Debe sentirse un zumbido en el labio.","trampa":"En español b y v suenan igual; en inglés vest y best son palabras distintas.","palabras":["very","value","level","have","over","improve"],"par":["vest","best"]},{"ipa":"z","nombre":"s sonora (zoo)","como":"Como una s pero con voz: zumba como una abeja. Pon la mano en la garganta y siente la vibración.","trampa":"Muchas s escritas suenan z: is, was, easy, reason.","palabras":["zoo","is","was","easy","reason","busy"],"par":["zip","sip"]},{"ipa":"ʃ","nombre":"sh (she)","como":"Labios hacia adelante en forma de trompa, lengua un poco atrás, sopla sin voz: el sonido de pedir silencio.","trampa":"No la cambies por ch: share no es chair.","palabras":["she","share","machine","nation","issue","sure"],"par":["share","chair"]},{"ipa":"dʒ","nombre":"j inglesa (job)","como":"Empieza como una d y suéltala en una sh con voz. Labios un poco hacia adelante.","trampa":"No es la j española (jota) ni la y: job no es yob.","pala function hablar(texto) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = est.lang === "en" ? "en-US" : "fr-FR";
  u.rate = .85;
  speechSynthesis.speak(u);
}

function toast(texto) {
  const t = document.createElement("div");
  t.className = "toast"; t.role = "status"; t.textContent = texto;
  document.body.append(t);
  setTimeout(() => t.remove(), 2200);
}

function anillo(fraccion, tam = 34) {
  const r = (tam - 5) / 2, c = 2 * Math.PI * r;
  return `<svg class="anillo" width="${tam}" height="${tam}" aria-hidden="true">
    <circle class="pista" cx="${tam / 2}" cy="${tam / 2}" r="${r}"/>
    <circle class="valor" cx="${tam / 2}" cy="${tam / 2}" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - fraccion)}"/></svg>`;
}

}

  return `<header class="barra"><span class="marca"><i></i>IPA Coach</span>${selectorIdioma()}</header>
    <h1>Hola de nuevo.</h1>
    <p class="sub">Llevas 6 días seguidos. Unos minutos hoy y la mantienes.</p>
    ${avisoModelo()}
    <article class="tarjeta heroe" aria-labelledby="del-dia">
      <span class="etiqueta">Sonido del día</span>
      <div class="glifo ipa" aria-hidden="true">${dia.ipa}</div>
      <h3 id="del-dia">${dia.nombre}</h3>
      <p>${dia.trampa}</p>
      <div class="palabritas">${dia.palabras.slice(0, 4).map(w => `<span>${w}</span>`).join("")}</div>
      <button class="boton primario" data-leccion="${i}">Empezar</button>
    </article>
    <h2>Vocales <span>${voc.length}</span></h2>
    <div class="rejilla">${voc.map(([l, n]) => losa(l, n)).join("")}</div>
    <h2>Consonantes <span>${cons.length}</span></h2>
    <div class="rejilla">${cons.map(([l, n]) => losa(l, n)).join("")}</div>`;
}

function avisoModelo() {
  if (est.modelo >= 1) return "";
  return `<button class="aviso" data-abrir="modelo" aria-label="Preparando el evaluador, ${Math.round(est.modelo * 100)}%. Ver detalles">
    <span class="mini">${anillo(est.modelo)}</span>
    <span><b>Preparando el evaluador · <span id="pct-aviso">${Math.round(est.modelo * 100)}</span>%</b>
    Mientras tanto puedes escuchar y leer las lecciones.</span></button>`;
}

/* ---------- Sonidos ---------- */
function vistaSonidos() {
  const ls = lecciones().map((l, n) => [l, n]).filter(([l]) =>
    est.filtro === "todos" || VOCALES.has(l.ipa) === (est.filtro === "vocales"));
  const boton = (id, txt) => `<button data-filtro="${id}" aria-pressed="${est.filtro === id}">${txt}</button>`;
  return `<header class="barra"><span class="marca"><i></i>Sonidos</span>${selectorIdioma()}</header>
    <h1>${est.lang === "en" ? "Inglés" : "Francés"}</h1>
    <p class="sub">${lecciones().length} sonidos que el español no tiene o cambia.</p>
    <div class="filtro" role="group" aria-label="Filtrar">${boton("todos", "Todos")}${boton("vocales", "Vocales")}${boton("consonantes", "Consonantes")}</div>
    <div style="margin-top:8px">${ls.map(([l, n]) => `
      <button class="fila" data-leccion="${n}"><span class="ipa">${l.ipa}</span>
        <div><b>${l.nombre}</b><p>${l.como}</p></div>${ico.flecha}</button>`).join("")}</div>`;
}

/* ---------- Progreso ---------- */
function vistaProgreso() {
  const p = PROGRESO[est.lang], ls = lecciones();
  const buscar = ipa => ls.findIndex(l => l.ipa === ipa);
  const min = Math.min(...p.serie) - 10, max = 100, w = 320, h = 72;
  const pts = p.serie.map((v, n) => `${(n / (p.serie.length - 1)) * w},${h - 6 - ((v - min) / (max - min)) * (h - 12)}`).join(" ");
  const ultimo = pts.split(" ").pop().split(",");
  const dominados = ls.filter(l => (p.dominio[l.ipa] ?? 0) >= .7);
  return `<header class="barra"><span class="marca"><i></i>Progreso</span>${selectorIdioma()}</header>
    <h1>Vas bien.</h1>
    <p class="sub">Tu promedio subió 9 puntos en las últimas dos semanas.</p>
    <div class="cifras">
      <div class="tarjeta cifra"><div class="num">6<small>días</small></div><p>de racha</p></div>
      <div class="tarjeta cifra"><div class="num">${p.promedio}<small>%</small></div><p>promedio reciente</p></div>
    </div>
    <section class="tarjeta" style="margin-top:10px">
      <h2 style="margin:0">Esta semana <span>${p.intentos} intentos en total</span></h2>
      <div class="semana">${DIAS.map(([d, v]) => `<span class="dia${v ? " hecho" : ""}${v === 2 ? " hoy" : ""}"><i></i>${d}<span class="oculto">${v ? "practicaste" : "no practicaste"}</span></span>`).join("")}</div>
    </section>
    <section class="tarjeta" style="margin-top:10px">
      <h2 style="margin:0">Últimos 20 intentos <span>${p.serie.at(-1)}%</span></h2>
      <svg class="linea-grafica" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Acierto de los últimos 20 intentos, de ${p.serie[0]}% a ${p.serie.at(-1)}%">
        <polyline points="${pts}" fill="none" stroke="var(--acento)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        <circle cx="${ultimo[0]}" cy="${ultimo[1]}" r="3.5" fill="var(--acento)"/></svg>
    </section>
    <h2>Para trabajar <span>más fallados</span></h2>
    <div class="trabajar">${p.dificiles.map(([ipa, f, t]) => {
      const l = ls[buscar(ipa)];
      return `<button class="fila" data-leccion="${buscar(ipa)}"><span class="ipa">${ipa}</span>
        <div><b>${l.nombre}</b><p>Fallado ${f} de ${t} veces</p><div class="medidor" aria-hidden="true"><i style="width:${(f / t) * 100}%"></i></div></div>${ico.flecha}</button>`;
    }).join("")}</div>
    <h2>Ya te salen <span>${dominados.length}</span></h2>
    <div class="dominados">${dominados.map(l => `<span class="ipa" title="${l.nombre}">${l.ipa}</span>`).join("")}</div>`;
}

/* ---------- Lección ---------- */
function vistaLeccion() {
  const l = lecciones()[est.leccion];
  const palabra = l.palabras[est.palabra];
  const objetivo = ipaDe(palabra).map(f => f === l.ipa ? `<mark>${f}</mark>` : f).join("");
  const parIpa = w => ipaDe(w).join("");
  return `<header class="cabecera">
      <button class="redondo" data-volver aria-label="Volver">${ico.atras}</button>
      <div class="titulo">${l.nombre}<small>${est.lang === "en" ? "Inglés" : "Francés"}</small></div></header>
    <div class="leccion-glifo ipa" aria-hidden="true">${l.ipa}</div>

    <section class="paso" aria-labelledby="p1"><h2 id="p1">1 · Cómo se hace</h2>
      <p class="como">${l.como}</p>
      <div class="ojo" role="note"><span aria-hidden="true">${ico.alerta}</span><span><b>Ojo.</b> ${l.trampa}</span></div>
    </section>

    <section class="paso" aria-labelledby="p2"><h2 id="p2">2 · Dilo tú <span>${est.palabra + 1} de ${l.palabras.length}</span></h2>
      <div class="palabras" role="group" aria-label="Palabras">${l.palabras.map((w, n) =>
        `<button data-palabra="${n}" aria-pressed="${n === est.palabra}">${w}</button>`).join("")}</div>
      <div class="tarjeta practica">
        <div class="palabra">${palabra}</div>
        <div class="objetivo ipa" aria-label="Pronunciación esperada">/${objetivo}/</div>
        <button class="redondo" data-hablar="${palabra}">${ico.play} Escuchar</button>
        <div id="zona-resultado">${zonaResultado(l)}</div>
      </div>
    </section>

    <section class="paso" aria-labelledby="p3"><h2 id="p3">3 · Par mínimo</h2>
      <p class="sub" style="margin:-4px 0 12px">Escucha la diferencia y di las dos.</p>
      <div class="par">${l.par.map(w => `<button data-hablar="${w}" aria-label="Escuchar ${w}">
        <b>${w}</b><span class="ipa">/${parIpa(w)}/</span><small>${ico.play} Escuchar</small></button>`).join("")}</div>
    </section>`;
}

function zonaResultado(l) {
  if (est.micBloqueado && est.grab === "error") return `
    <div class="error" role="alert">
      <div class="icono">${ico.micNo}</div>
      <h3>No tengo acceso al micrófono</h3>
      <p>Sin micrófono no puedo escucharte. Actívalo en Chrome:</p>
      <ol><li>Toca el ${ico.candado.replace('width="18" height="18"', 'width="15" height="15" style="vertical-align:-2px"')} junto a la dirección.</li>
        <li>Entra a <b>Permisos</b> → <b>Micrófono</b>.</li><li>Elige <b>Permitir</b> y vuelve aquí.</li></ol>
      <button class="boton primario" data-reintentar>Reintentar</button></div>`;
  if (est.grab === "analizando") return `<div class="resultado" aria-busy="true"><p class="sub">Escuchando cada sonido…</p>
    <div class="esqueleto" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div>`;
  if (est.grab !== "resultado" || !est.resultado) return "";
  const r = est.resultado, bien = r.filas.filter(f => f.estado === "bien").length;
  const txt = { bien: "bien", casi: "casi", mal: "repite" };
  const marca = { bien: "✓", casi: "~", mal: "✕" };
  const fallo = r.filas.find(f => f.estado === "mal") || r.filas.find(f => f.estado === "casi");
  const consejo = !fallo ? "Todo en su sitio. Prueba la siguiente palabra."
    : fallo.estado === "mal" ? `La <span class="ipa">/${fallo.ipa}/</span> te salió como <span class="ipa">/${fallo.sono}/</span>. Repasa el paso 1 y vuelve a intentarlo.`
    : `La <span class="ipa">/${fallo.ipa}/</span> va por buen camino; exagérala un poco más.`;
  return `<div class="resultado">
    <div class="nota"><span class="num">${r.acierto}%</span><p>${bien} de ${r.filas.length} sonidos bien</p></div>
    <ul class="fichas" aria-label="Resultado por sonido">${r.filas.map((f, n) => `
      <li class="ficha ${f.estado}" style="animation-delay:${n * 60}ms" aria-label="/${f.ipa}/: ${txt[f.estado]}${f.sono !== f.ipa ? `, sonó como /${f.sono}/` : ""}">
        <span class="ipa">${f.ipa}</span>
        <small><span aria-hidden="true">${marca[f.estado]}</span> ${f.sono !== f.ipa ? `sonó <span class="ipa">${f.sono}</span>` : txt[f.estado]}</small></li>`).join("")}</ul>
    <p class="oido">Se oyó <span class="ipa">/${r.oido}/</span></p>
    <p class="consejo">${consejo}</p>
    <div class="acciones">
      <button class="boton secundario" data-tu-voz>${ico.play} Tu voz</button>
      <button class="boton secundario" data-siguiente>Siguiente ${ico.flecha}</button></div>
    <div class="leyenda" aria-hidden="true"><span><i style="background:var(--bien)"></i>bien</span><span><i style="background:var(--casi)"></i>casi</span><span><i style="background:var(--mal)"></i>repite</span></div>
  </div>`;
}

function dock() {
  const g = est.grab;
  const etiqueta = { listo: "Grabar", grabando: "Terminar grabación", analizando: "Analizando", resultado: "Grabar otra vez", error: "Grabar" }[g];
  const ayuda = { listo: "Toca y di la palabra", grabando: '<span id="reloj">0:00</span> · toca para terminar',
    analizando: "Analizando…", resultado: "Toca para intentarlo otra vez", error: "Micrófono sin permiso" }[g];
  return `<div class="dock">
    ${g === "grabando" ? `<div class="ondas" aria-hidden="true">${"<i></i>".repeat(24)}</div>` : ""}
    <button class="grabar" data-estado="${g}" data-grabar aria-label="${etiqueta}" ${g === "analizando" ? "disabled" : ""}>
      ${g === "grabando" ? ico.stop : ico.mic}</button>
    <p>${ayuda}</p></div>`;
}

/* ---------- Puntaje falso ---------- */
function resultadoFalso(l, palabra, patron) {
  const fonemas = ipaDe(palabra);
  const blanco = fonemas.includes(l.ipa) ? l.ipa : fonemas[0];
  const otra = fonemas.find(f => f !== blanco && VOCALES.has(f));
  const filas = fonemas.map(f => {
    let estado = "bien";
    if (patron === "mixto") estado = f === blanco ? "mal" : f === otra ? "casi" : "bien";
    if (patron === "mal") estado = f === blanco ? "mal" : f === otra ? "mal" : "bien";
    const sono = estado === "bien" ? f : CONFUSION[f] || f;
    return { ipa: f, estado, sono };
  });
  return { filas, oido: filas.map(f => f.sono).join(""), acierto: Math.round(100 * filas.filter(f => f.estado === "bien").length / filas.length) };
}

/* ---------- Grabación simulada ---------- */
let reloj, ondas;
function grabar() {
  if (est.grab === "grabando") return terminar();
  if (est.modelo < 1) return abrirModelo();
  if (est.micBloqueado) { est.grab = "error"; anunciar("No hay acceso al micrófono"); return pintar(); }
  est.grab = "grabando"; est.resultado = null; pintar();
  anunciar("Grabando");
  const inicio = Date.now(), barras = [...document.querySelectorAll(".ondas i")];
  reloj = setInterval(() => {
    const s = Math.floor((Date.now() - inicio) / 1000);
    const r = document.getElementById("reloj"); if (r) r.textContent = `0:0${s}`;
    if (s >= 4) terminar();
  }, 250);
  if (!reducido) ondas = setInterval(() => barras.forEach((b, n) =>
    b.style.height = 4 + Math.random() * 24 * Math.sin(Math.PI * (n + 1) / 25) + "px"), 90);
}

function terminar() {
  clearInterval(reloj); clearInterval(ondas);
  est.grab = "analizando"; pintar();
  setTimeout(() => mostrarResultado(PATRONES[est.intento++ % PATRONES.length]), 900);
}

function mostrarResultado(patron) {
  const l = lecciones()[est.leccion];
  est.resultado = resultadoFalso(l, l.palabras[est.palabra], patron);
  est.grab = "resultado"; pintar();
  anunciar(`${est.resultado.acierto}% de sonidos bien`);
  document.getElementById("zona-resultado")?.scrollIntoView({ behavior: reducido ? "auto" : "smooth", block: "center" });
}

/* ---------- Descarga del modelo (simulada) ---------- */
let descarga;
function iniciarDescarga() {
  clearInterval(descarga);
  descarga = setInterval(() => {
    est.modelo = Math.min(1, est.modelo + .012 + Math.random() * .01);
    actualizarCarga();
    if (est.modelo >= 1) { clearInterval(descarga); if (!capa.innerHTML && est.vista === "practicar") pintar(); }
  }, 120);
}

function actualizarCarga() {
  const pct = Math.round(est.modelo * 100);
  const aviso = document.getElementById("pct-aviso");
  if (aviso) { aviso.textContent = pct; aviso.closest(".aviso").querySelector(".mini").innerHTML = anillo(est.modelo); }
  const barra = document.getElementById("barra-modelo");
  if (!barra) return;
  barra.style.width = pct + "%";
  barra.parentElement.setAttribute("aria-valuenow", pct);
  document.getElementById("mb-modelo").textContent = est.modelo >= 1 ? "Listo" : `${Math.round(est.modelo * MB)} MB de ${MB} MB`;
  document.getElementById("paso-modelo").textContent = est.modelo >= 1 ? "Funciona sin internet" : est.modelo > .9 ? "Preparando…" : "Descargando…";
  const b = document.getElementById("boton-modelo");
  if (est.modelo >= 1 && b.dataset.listo !== "1") { b.dataset.listo = "1"; b.textContent = "Empezar a practicar"; b.className = "boton primario"; }
}

function abrirModelo() {
  capa.innerHTML = `<div class="velo" data-cerrar>
    <div class="hoja" role="dialog" aria-modal="true" aria-labelledby="t-modelo">
      <div class="agarre" aria-hidden="true"></div>
      <span class="etiqueta">Solo la primera vez</span>
      <h3 id="t-modelo">Preparando el evaluador</h3>
      <p>Para corregirte sonido por sonido, IPA Coach guarda en tu teléfono un modelo que reconoce fonemas.</p>
      <ul class="puntos">
        <li>${ico.wifi}<span>Son unos ${MB} MB. Mejor con Wi-Fi.</span></li>
        <li>${ico.check}<span>Se descarga una vez; después funciona sin internet.</span></li>
        <li>${ico.candado}<span>Tu voz se analiza en el teléfono y no sale de él.</span></li>
      </ul>
      <div class="barra-carga" role="progressbar" aria-label="Descarga del modelo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="barra-modelo"></i></div>
      <div class="carga-texto"><span id="paso-modelo">Descargando…</span><span id="mb-modelo"></span></div>
      <button class="boton secundario" id="boton-modelo" data-cerrar-boton>Seguir leyendo mientras tanto</button>
    </div></div>`;
  actualizarCarga();
  capa.querySelector("#boton-modelo").focus();
}

function cerrarCapa() { capa.innerHTML = ""; pintar(); }

/* ---------- Navegación ---------- */
function pintar() {
  const enLeccion = est.vista === "leccion";
  app.innerHTML = `<main class="vista" id="vista-${est.vista}">${
    { practicar: vistaPracticar, sonidos: vistaSonidos, progreso: vistaProgreso, leccion: vistaLeccion }[est.vista]()}</main>
    ${enLeccion ? dock() : ""}`;
  document.getElementById("pestanas").hidden = enLeccion;
  document.querySelectorAll("[data-ir]").forEach(b => b.dataset.ir === est.vista ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
}

function ir(vista) {
  clearInterval(reloj); clearInterval(ondas);
  est.vista = vista; pintar(); scrollTo(0, 0);
}

function abrirLeccion(n) {
  Object.assign(est, { leccion: n, palabra: 0, grab: "listo", resultado: null });
  ir("leccion");
}

document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-cerrar]");
  if (!t) return;
  const d = t.dataset;
  if (d.cerrar !== undefined && e.target !== t) return;
  if (d.ir) ir(d.ir);
  else if (d.lang) { est.lang = d.lang; pintar(); }
  else if (d.filtro) { est.filtro = d.filtro; pintar(); }
  else if (d.leccion !== undefined) abrirLeccion(+d.leccion);
  else if (d.volver !== undefined) ir("practicar");
  else if (d.palabra !== undefined) { est.palabra = +d.palabra; est.grab = "listo"; est.resultado = null; pintar(); }
  else if (d.hablar) hablar(d.hablar);
  else if (d.grabar !== undefined) grabar();
  else if (d.siguiente !== undefined) { est.palabra = (est.palabra + 1) % lecciones()[est.leccion].palabras.length; est.grab = "listo"; est.resultado = null; pintar(); }
  else if (d.tuVoz !== undefined) toast("Aquí sonaría tu grabación");
  else if (d.reintentar !== undefined) { est.micBloqueado = false; est.grab = "listo"; pintar(); toast("Micrófono activado"); }
  else if (d.abrir === "modelo") abrirModelo();
  else if (d.cerrar !== undefined || d.cerrarBoton !== undefined) cerrarCapa();
  else if (d.demo) demo(d.demo);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && capa.innerHTML) cerrarCapa(); });

function demo(caso) {
  document.getElementById("demo").open = false;
  capa.innerHTML = "";
  const delDia = lecciones().findIndex(l => l.ipa === DEL_DIA[est.lang]);
  if (caso === "modelo") { est.modelo = 0; ir("practicar"); iniciarDescarga(); return abrirModelo(); }
  est.modelo = 1; clearInterval(descarga);
  est.micBloqueado = caso === "mic";
  if (est.vista !== "leccion") abrirLeccion(delDia);
  if (caso === "grabando") return grabar();
  if (caso === "mic") return grabar();
  est.grab = "listo"; mostrarResultado(caso);
}

pintar();
iniciarDescarga();
// Atajo para revisar un estado directo: index.html#mixto, #progreso, #mic…
const atajo = location.hash.slice(1);
if (["sonidos", "progreso"].includes(atajo)) { est.modelo = 1; ir(atajo); }
else if (["modelo", "grabando", "mixto", "bien", "mal", "mic"].includes(atajo)) demo(atajo);
</script>
</body>
</html>
