<!doctype html>
<meta charset="utf-8">
<!-- Plantilla del ícono (herramientas/iconos.sh). ?mascara lo deja a sangre: Android recorta la forma. ?t=192 cambia el tamaño. -->
<style>
  @font-face { font-family: "Noto IPA"; src: url(../fuentes/noto-ipa.woff2); }
  html, body { margin: 0; overflow: hidden; background: transparent; }
  .fondo { position: absolute; top: 0; left: 0; width: 512px; height: 512px; display: grid; place-items: center; background: #0a0a0b; border-radius: 112px; overflow: hidden; transform-origin: 0 0; }
  .mascara .fondo { border-radius: 0; }
  .fondo::before { content: ""; position: absolute; inset: 10%; background: radial-gradient(closest-side, rgba(143,160,255,.3), transparent); }
  b { position: relative; font: 400 470px/1 "Noto IPA"; color: #8fa0ff; margin-top: -110px; }
  .mascara b { font-size: 380px; margin-top: -86px; }
</style>
<body><div class="fondo"><b>ə</b></div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.has("mascara")) document.documentElement.className = "mascara";
  document.querySelector(".fondo").style.transform = `scale(${(q.get("t") || 512) / 512})`;
</script>
